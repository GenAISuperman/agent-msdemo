apiVersion: apps/v1
kind: Deployment
metadata:
  name: "msdemo"
  namespace: "agents-devateam"
  labels:
    app: "msdemo"
    team: "devateam"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "msdemo"
  template:
    metadata:
      labels:
        app: "msdemo"
        team: "devateam"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "sa-msdemo"
      containers:
        - name: "msdemo"
          image: "acragenticdemopoc.azurecr.io/agents/msdemo:latest"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: "config-msdemo"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
